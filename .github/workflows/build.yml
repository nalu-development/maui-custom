name: Build

on:
    push:
        branches:
            - sr11-custom
    pull_request:
    workflow_dispatch:

env:
    # Disable the .NET logo in the console output.
    DOTNET_NOLOGO: true
    # Disable the .NET first time experience to skip caching NuGet packages and speed up the build.
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
    # Disable sending .NET CLI telemetry to Microsoft.
    DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
    build:
        name: Build-${{matrix.os}}
        runs-on: ${{matrix.os}}
        strategy:
            matrix:
                os: [macOS-26]
        steps:
            - name: "Checkout"
              uses: actions/checkout@v4
              with:
                  lfs: true
                  fetch-depth: 0
            - name: "Patch Configurations"
              run: |
                  sed -i '' 's@NUGET_ONLY_PLACEHOLDER@https://api.nuget.org/v3/index.json@g' NuGet.config
                  # Pin the SDK so the runner's newer preinstalled SDK isn't picked up.
                  jq '.sdk.version = "10.0.302" | .sdk.rollForward = "disable"' global.json > global.json.tmp && mv global.json.tmp global.json
                  # Version packages as e.g. 10.0.110-nalu.90 so they don't clash with Microsoft's stable ones.
                  echo "-p:VersionSuffix=nalu.${{github.run_number}}" > Directory.Build.rsp
            - name: "Setup .NET"
              uses: actions/setup-dotnet@v4
              with:
                  global-json-file: global.json
            - name: "Dotnet Tool Restore"
              run: dotnet tool restore
            - name: "Install workloads"
              run: |
                  dotnet workload install ios android
            - name: "Dotnet Cake Pack"
              run: |
                  curl https://aka.ms/download-jdk/microsoft-jdk-17.0.15-macos-aarch64.pkg --output microsoft-jdk-17.0.15-macos-aarch64.pkg -L
                  sudo installer -pkg microsoft-jdk-17.0.15-macos-aarch64.pkg -target /
                  export JAVA_HOME=$(/usr/libexec/java_home -v 17.0.15)
                  rm -rf ~/.gradle/caches/
                  dotnet cake --target=dotnet-pack --android --ios --configuration=Release --usenuget=false --workloads=system --officialBuildId=$(date -u +%Y%m%d).${{github.run_number}}
            - name: "Publish Artifacts"
              uses: actions/upload-artifact@v4.4.3
              with:
                  name: ${{matrix.os}}
                  path: "./artifacts/packages/Release/Shipping"
    
    push-github-packages:
        name: "Push GitHub Packages"
        needs: build
        environment:
            name: "GitHub Packages"
            url: https://github.com/nalu-development/maui-custom/packages
        permissions:
            packages: write
        runs-on: windows-latest
        steps:
            - name: "Download Artifacts"
              uses: actions/download-artifact@v4.1.8
              with:
                  name: "macOS-26"
            - name: "Dotnet NuGet Add Source"
              run: dotnet nuget add source https://nuget.pkg.github.com/nalu-development/index.json --name GitHub --username albyrock87 --password ${{secrets.GITHUB_TOKEN}}
              shell: pwsh
            - name: "Dotnet NuGet Push"
              run: dotnet nuget push .\*.nupkg --api-key ${{ github.token }} --source GitHub --skip-duplicate
              shell: pwsh